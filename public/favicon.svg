<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E6B4F"/>
      <stop offset="1" stop-color="#15513B"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C89B5A"/>
      <stop offset="1" stop-color="#A96F3A"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- chalkboard board -->
  <rect width="1024" height="1024" fill="url(#board)"/>
  <rect width="1024" height="1024" fill="url(#sheen)"/>
  <rect x="56" y="56" width="912" height="912" rx="200" fill="url(#wood)"/>
  <rect x="96" y="96" width="832" height="832" rx="168" fill="url(#board)"/>

  <!-- chalk dust -->
  <circle cx="150" cy="340" r="6" fill="#fff" opacity="0.07"/>
  <circle cx="880" cy="300" r="8" fill="#fff" opacity="0.07"/>
  <circle cx="160" cy="700" r="5" fill="#fff" opacity="0.07"/>
  <circle cx="900" cy="760" r="7" fill="#fff" opacity="0.07"/>
  <circle cx="720" cy="120" r="5" fill="#fff" opacity="0.07"/>

  <!-- chalk ÷ × + − -->
  <g transform="rotate(-10 205 195)">
    <path d="M135 195h140" stroke="#FBF4E3" stroke-width="24" stroke-linecap="round" fill="none"/>
    <circle cx="115" cy="95" r="24" fill="#FBF4E3"/>
    <circle cx="295" cy="295" r="24" fill="#FBF4E3"/>
  </g>
  <g transform="rotate(8 819 195)">
    <path d="M749 125l140 140M889 125L749 265" stroke="#FBF4E3" stroke-width="24" stroke-linecap="round" fill="none"/>
  </g>
  <g transform="rotate(6 205 829)">
    <path d="M135 829h140M205 759v140" stroke="#FBF4E3" stroke-width="24" stroke-linecap="round" fill="none"/>
  </g>
  <g transform="rotate(-6 819 829)">
    <path d="M749 829h140" stroke="#FBF4E3" stroke-width="24" stroke-linecap="round" fill="none"/>
  </g>

  <!-- abacus mascot -->
  <rect x="170" y="246" width="684" height="564" rx="80" fill="#15513B" opacity="0.18"/>
  <rect x="170" y="230" width="684" height="564" rx="80" fill="#FFFCF4" stroke="#E3D8BB" stroke-width="8"/>
  <rect x="206" y="282" width="26" height="460" rx="13" fill="#E4572E"/>
  <rect x="258" y="286" width="508" height="452" rx="44" fill="none" stroke="#C89B5A" stroke-width="24"/>
  <rect x="288" y="316" width="448" height="392" rx="30" fill="#FBF6E9"/>
  <line x1="318" y1="400" x2="706" y2="400" stroke="#A96F3A" stroke-width="10" stroke-linecap="round"/>
  <line x1="318" y1="512" x2="706" y2="512" stroke="#A96F3A" stroke-width="10" stroke-linecap="round"/>
  <line x1="318" y1="624" x2="706" y2="624" stroke="#A96F3A" stroke-width="10" stroke-linecap="round"/>
  <!-- beads: row1 gold/mint | sky/coral ; row2 sky/coral | mint/gold ; row3 mint/gold | coral/sky -->
  <circle cx="348" cy="400" r="30" fill="#F0B429"/><circle cx="396" cy="400" r="30" fill="#1F9D6E"/>
  <circle cx="628" cy="400" r="30" fill="#3B82C4"/><circle cx="676" cy="400" r="30" fill="#D9483A"/>
  <circle cx="348" cy="512" r="30" fill="#3B82C4"/><circle cx="396" cy="512" r="30" fill="#D9483A"/>
  <circle cx="628" cy="512" r="30" fill="#1F9D6E"/><circle cx="676" cy="512" r="30" fill="#F0B429"/>
  <circle cx="348" cy="624" r="30" fill="#1F9D6E"/><circle cx="396" cy="624" r="30" fill="#F0B429"/>
  <circle cx="628" cy="624" r="30" fill="#D9483A"/><circle cx="676" cy="624" r="30" fill="#3B82C4"/>
  <!-- face -->
  <circle cx="512" cy="512" r="88" fill="#FFFCF4" stroke="#C89B5A" stroke-width="10"/>
  <circle cx="484" cy="500" r="13" fill="#33302B"/>
  <circle cx="540" cy="500" r="13" fill="#33302B"/>
  <circle cx="478" cy="492" r="4.5" fill="#ffffff"/>
  <circle cx="534" cy="492" r="4.5" fill="#ffffff"/>
  <circle cx="462" cy="522" r="11" fill="#E4572E" opacity="0.45"/>
  <circle cx="562" cy="522" r="11" fill="#E4572E" opacity="0.45"/>
  <path d="M494 528 Q 512 546 530 528" fill="none" stroke="#33302B" stroke-width="8" stroke-linecap="round"/>
</svg>
